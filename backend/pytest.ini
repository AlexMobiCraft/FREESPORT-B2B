[pytest]
DJANGO_SETTINGS_MODULE = freesport.settings.test
python_files = tests.py test_*.py *_tests.py
pythonpath = .
markers =
    unit: юнит-тесты бэкенда (модульные тесты)
    integration: integration tests
    data_dependent: tests that depend on external data
    slow: таймингозависимые тесты — исключены из всех PR-гейтов, исполняются в nightly
    performance: перф-тесты (медленные и шумные, вне обычного гейта)
# Где искать тесты при запуске без путей. Без этого pytest обходит весь корень,
# включая data/ (1,4 ГБ выгрузок 1С): в Docker на Windows это минуты лишнего сбора.
testpaths = apps tests freesport
# Каталоги, которые pytest не обходит. Список должен совпадать с корневым pytest.ini:
# файл, случайно попавший в необходимый каталог, обрывает сбор сторожем из conftest.py.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv* env htmlcov staticfiles media temp
filterwarnings =
    ignore:Converter 'drf_format_suffix' is already registered.*:django.utils.deprecation.RemovedInDjango61Warning
