name: "Нужен ли прогон"
description: >-
  Решает, содержит ли PR что-либо исполняемое. Гейты используют результат, чтобы
  пропускать тяжёлые шаги на PR, состоящих только из документации.

# Зачем это существует
#
# Гейт на develop — шесть required-контекстов, и его ожидание держит `build (3.12)`
# (~13 минут). PR вида «правка стори + sprint-status» прогонял весь набор впустую.
#
# Почему не по имени ветки: `docs/*` — обещание, а не факт. Ветка
# `ci/drop-dead-steps-django-ci` (2026-09-20) меняла workflow, документацию и тест
# разом; гейт, доверяющий имени, пропустил бы такой PR без тестов.
#
# Почему ALLOWLIST, а не «нет правок в backend/»: обратная логика при появлении кода
# в новом каталоге молча пропустила бы тесты. Здесь любой незнакомый путь ведёт к
# полному прогону — ошибаться нужно в сторону лишних тринадцати минут.
#
# Почему отдельный action, а не шаг в каждом workflow: списки путей обязаны совпадать
# во всех гейтах, иначе один из них однажды пропустит то, что проверяет другой.
# Здесь они заданы один раз, и сторож TestCIFilters::test_docs_only_filter_* читает
# именно этот файл.
#
# ВАЖНО для вызывающего: результат применяется к ШАГАМ, а не к job'у. Job, скипнутый
# через job-level `if`, может не сообщить свой check-run, а все эти контексты —
# required; тогда мерж повиснет на «Expected — waiting for status» бессрочно.

inputs:
  github-token:
    description: "Токен для gh pr diff"
    required: true

outputs:
  run:
    description: "'true' — в PR есть исполняемые файлы, нужен полный прогон"
    value: ${{ steps.decide.outputs.run }}

runs:
  using: composite
  steps:
    - name: Нужен ли прогон
      id: decide
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        # Пути, которые сами по себе ничего не исполняют.
        ALLOWLIST: '^(docs/|_bmad-output/|\.windsurf/|\.claude/|LICENSE$)|\.md$'
        # Исключения: лежат в docs/, но документацией не являются. docs/api/openapi.yaml
        # — контракт API, его сверяет api-contract и тесты схемы. `.md` внутри docs/api/
        # — настоящая документация и под denylist не попадает.
        DENYLIST: '^docs/api/.*\.(ya?ml|json)$'
      run: |
        # Неудача gh и пустой ответ трактуются как «гонять»: молча зелёный гейт без
        # проверок хуже лишних минут. Код возврата проверяется отдельно от grep —
        # через конвейер без pipefail вернулся бы только статус grep.
        if ! FILES=$(gh pr diff "${{ github.event.pull_request.number }}" --name-only) || [ -z "$FILES" ]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "⚠️ Не удалось определить состав PR — гоняем полный набор"
          exit 0
        fi

        # Гоняем, если есть файл вне allowlist ИЛИ файл из denylist.
        if grep -vqE "$ALLOWLIST" <<<"$FILES" || grep -qE "$DENYLIST" <<<"$FILES"; then
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "✅ В PR есть исполняемые файлы — гоняем полный набор:"
          # `|| true` обязательны: composite-шаг идёт с `-e -o pipefail`, а grep,
          # ничего не нашедший, возвращает 1 — без них печать списка роняла шаг
          # целиком (прогон 35508285945: четыре гейта красные за 30 секунд).
          { grep -vE "$ALLOWLIST" <<<"$FILES" || true; grep -E "$DENYLIST" <<<"$FILES" || true; } \
            | sort -u | sed 's/^/   /'
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "⏭️ PR состоит только из документации — тяжёлые шаги пропускаются:"
          sed 's/^/   /' <<<"$FILES"
          echo "   Чек всё равно сообщает статус: он входит в required-контексты защиты develop."
        fi
