# Docker Compose для тестирования OPTISPORT Platform
name: freesport-test

services:
  # PostgreSQL тестовая база данных
  db:
    image: postgres:15-alpine
    container_name: freesport-test-db
    environment:
      POSTGRES_DB: freesport_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432" # Другой порт чтобы не конфликтовать с основной БД
    networks:
      - freesport-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freesport_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    tmpfs:
      - /tmp
      # Данные БД в памяти, а не на томе Docker. pytest-django после КАЖДОГО теста
      # `tests/integration` делает flush (TRUNCATE всех таблиц), а на томе файловая система
      # WSL2 создаёт и удаляет файлы relfilenode медленно: ~1,5 с на flush против ~0,24 с на
      # tmpfs — это ~74% времени полного прогона. Тестовые БД (`test_*`, `_gwN`) pytest
      # пересоздаёт при каждом запуске, поэтому после `down` или перезапуска контейнера
      # терять нечего. Потолок 3g — размер, на котором проходил полный набор при `-n 8`.
      - /var/lib/postgresql/data:size=3g
    shm_size: 256mb

  # Redis для тестового кеширования
  redis:
    image: redis:7-alpine
    container_name: freesport-test-redis
    command: redis-server --appendonly no --save "" --requirepass redis123
    ports:
      - "6380:6379" # Другой порт чтобы не конфликтовать с основным Redis
    networks:
      - freesport-test-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    tmpfs:
      - /data

  # Django Backend для тестирования
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.test
      args:
        DJANGO_SETTINGS_MODULE: freesport.settings.test
    container_name: freesport-backend-test
    environment:
      - DJANGO_SETTINGS_MODULE=freesport.settings.test
      - SECRET_KEY=test-secret-key-for-testing-only
      - DB_NAME=freesport_test
      - DB_USER=postgres
      - DB_PASSWORD=password123
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://:redis123@redis:6379/1
      - DEBUG=0
      - PYTHONUTF8=1
      - PYTHONUNBUFFERED=1
      # Настройки для pytest
      - PYTEST_CURRENT_TEST=1
      - TEST_RUNNER=pytest
    volumes:
      # Используем относительные пути, которые будут работать на любой машине
      - ../backend:/app
      # Реальные XML для 1C-импорта лежат в backend/data/import_1c
      - ../backend/data/import_1c:/app/data/import_1c
      # Story 36.1: сторожа инвариантов читают файлы вне backend/ — в контейнер смонтирован
      # только backend/ (как /app), поэтому всё остальное подмонтировано явно. Без этих трёх
      # строк тесты не падают, а тихо скипаются: инвариант проверяется впервые уже в CI.
      # docker/ — конфиги nginx (гарды /media/1c_import|1c_temp) и сам docker-compose.test.yml
      # (сторож, запрещающий здесь подстановку переменных окружения).
      - ../docker:/app/docker:ro
      # .github/ — workflow-файлы для сторожей CI-фильтров (TestCIFilters).
      - ../.github:/app/.github:ro
      # scripts/deploy/ — скрипт HTTP-проверки маршрута /manager/ (стори 42.4), его тест
      # запускает скрипт против локального HTTP-сервера. Только этот каталог: Python-скрипты
      # остального scripts/ попали бы под black, flake8 и mypy контейнера.
      - ../scripts/deploy:/app/scripts/deploy:ro
      # Корневой pytest.ini лежит на уровень выше backend/ — сторожа сверяют объявленные
      # маркеры двух конфигов. Путь в контейнере повторяет раскладку репозитория: /app/../.
      - ../pytest.ini:/pytest.ini:ro
      # Эталонный HTML визуального редактора админки: test_rich_editor_upload.py проверяет,
      # что bleach пропускает его без изменений. Путь тоже повторяет раскладку репозитория.
      - ../frontend/admin-editor/__tests__/fixtures:/frontend/admin-editor/__tests__/fixtures:ro
      - test_coverage:/app/htmlcov
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - freesport-test-network
    # По умолчанию запускаем все тесты
    command:
      ["pytest", "-v", "--cov=apps", "--cov-report=html", "--cov-report=term"]

volumes:
  test_coverage:
    driver: local

networks:
  freesport-test-network:
    driver: bridge
    name: freesport-test-network
