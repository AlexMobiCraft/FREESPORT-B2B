# Jail: автоматическая блокировка атакующих Next.js Server Actions
[nginx-server-actions]
enabled = true
port = http,https
filter = nginx-server-actions
logpath = /home/freesport/freesport/data/prod/nginx-logs/access.log
backend = polling
maxretry = 5
findtime = 600
bantime = 3600
ignoreip = 127.0.0.1/8 ::1 5.35.124.149
banaction = nftables-multiport