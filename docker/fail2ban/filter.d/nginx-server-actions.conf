# Filter: попытки эксплуатации Next.js Server Actions
# Ловит POST-запросы к /_next/* и подозрительные пути (RCE-эксплойты)
[Definition]
failregex = ^<HOST> - - .* "POST /_next/[^"]*" \d+
            ^<HOST> - - .* "POST /[^"]*\?[^"]*cmd=[^"]*" \d+
            ^<HOST> - - .* "GET /device\.rsp[^"]*" \d+
ignoreregex =
datepattern = %%d/%%b/%%Y:%%H:%%M:%%S %%z