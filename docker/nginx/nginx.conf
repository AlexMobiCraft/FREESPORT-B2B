# Nginx конфигурация для FREESPORT Platform
user nginx;
worker_processes auto;
error_log /dev/stderr warn;
# access_log в файл на хосте (для fail2ban) + в stdout (для docker logs)
# access_log ниже переопределён: пишем и в файл, и в docker logs
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    access_log /dev/stdout main;

    # Базовые настройки производительности
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        text/css
        text/javascript
        text/xml
        text/plain
        text/x-component
        application/x-font-ttf
        application/vnd.ms-fontobject
        font/opentype;

    # Буферизация
    client_body_buffer_size 128k;
    client_max_body_size 50m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;

    # Upstream серверы
    upstream backend {
        least_conn;
        server backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend {
        least_conn;
        server frontend:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Blocklist: атакующие IP (Server Actions exploitation, RCE-сканеры)
    # Источник: анализ access-логов 2026-08-20
    # 104.28.0.0/16 — Cloudflare WARP, атакующий подбирает Server Actions
    # 176.65.139.247 — RCE-эксплойт (wget armv7l)
    # Остальные — сканеры/brute-force
    geo $blocked_ip {
        default 0;
        104.28.0.0/16      1;
        176.65.139.247     1;
        103.215.75.19      1;
        202.61.130.55      1;
        156.238.254.80     1;
        45.148.10.238      1;
        38.49.42.30        1;
        23.94.216.234      1;
    }

    # Основная конфигурация включается из conf.d
    include /etc/nginx/conf.d/*.conf;
}
