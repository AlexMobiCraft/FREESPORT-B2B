# Локальная конфигурация (HTTP only или Self-Signed SSL)
#
# Стори 41.5: набор заголовков безопасности здесь задаётся ТЕМИ ЖЕ сниппетами,
# что и на проде (docker/nginx/snippets/), а не копией текста. Разница ровно
# одна и она осознанная — версия без HSTS: локально TLS нет.
# Смысл паритета — чтобы дефект вроде FR-41-22 («add_header в location стирает
# унаследованный набор») можно было увидеть локально, а не только на проде.
server {
    listen 80;
    server_name localhost;

    # Django Static и Media файлы
    location /static/ {
        alias /var/www/static/;
        access_log off;

        # Стори 41.5: тот же сниппет, что и на проде, но без HSTS (локально нет TLS)
        include /etc/nginx/snippets/security-headers-no-hsts.conf;
    }
    
    location /media/ {
        alias /var/www/media/;
        access_log off;

        # Стори 41.5: тот же сниппет, что и на проде, но без HSTS (локально нет TLS).
        # Вложенные локации 1c_temp/1c_import своих add_header не имеют и
        # наследуют набор отсюда; `always` в сниппете доставляет его и на их 404.
        include /etc/nginx/snippets/security-headers-no-hsts.conf;

        # Story 36.1: каталоги обмена 1С вынесены за MEDIA_ROOT. Guard'ы оставлены
        # как defense-in-depth — media-том переживает деплой, и файлы незавершённых
        # обменов, записанные до переезда, физически остаются здесь.
        # Сами файлы удаляет `manage.py purge_legacy_1c_media`.
        location /media/1c_temp/ {
            return 404;
        }

        location /media/1c_import/ {
            return 404;
        }
    }

    # Product images (base_images хранятся без /media/ префикса)
    location ~* ^/products/.*\.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        root /var/www/media;
        access_log off;

        # Стори 41.5: тот же сниппет, что и на проде, но без HSTS (локально нет TLS)
        include /etc/nginx/snippets/security-headers-no-hsts.conf;
    }

    # Django-локации (/api/, /admin/, /swagger/, /redoc/).
    #
    # Стори 41.5, ОСОЗНАННОЕ расхождение с продом: app-headers.conf здесь НЕ
    # подключается. Он содержит Strict-Transport-Security, которому по HTTP не
    # место, а заводить четвёртый сниппет ради дева — та же цена, что и
    # отменённое дерево включений. Локально эти локации остаются на заголовках,
    # которые Django ставит сам. Не «чини» это молча: страж, ловящий реальный
    # дефект, — backend/tests/unit/test_nginx_security_headers.py, он читает
    # оба конфига.
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger
    location /swagger/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ReDoc (стори 41.5: локации не было вовсе — по образцу /swagger/)
    location /redoc/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (стори 41.5: локации не было вовсе — по образцу default.conf).
    # Именно из-за её отсутствия дефект отсутствующих заголовков на /health
    # локально не увидел бы никто.
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;

        # Свой add_header выше вытеснил унаследованный набор — переобъявляем
        include /etc/nginx/snippets/security-headers-no-hsts.conf;
    }

    # Frontend
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
