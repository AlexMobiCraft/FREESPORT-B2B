# Основная конфигурация сайта FREESPORT Platform

# HTTP Server - перенаправляем на HTTPS
server {
    listen 80 default_server;
    server_name 5.35.124.149 localhost freesport.local optisport.ru www.optisport.ru;

    # Let's Encrypt ACME challenge (webroot метод для certbot renew без даунтайма)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Выведенный из эксплуатации домен freesport.ru.
# Стори 41.5: этот vhost и HTTP-редирект выше — вне объёма заголовков
# безопасности. Оба отвечают по HTTP без тела сайта (301 и 410 Gone),
# add_header Content-Type ниже — не заголовок безопасности. Тест-страж
# backend/tests/unit/test_nginx_security_headers.py исключает их явным списком.
# Блок нужен, чтобы старый домен не обслуживался молча через default_server:
# запросы получают явный 410 Gone вместо копии сайта под чужим именем.
server {
    listen 80;
    server_name freesport.ru www.freesport.ru;

    location / {
        return 410 "freesport.ru is no longer in service\n";
        add_header Content-Type text/plain;
    }
}

# Internal Server - для взаимодействия между контейнерами (например, Next.js Image Optimization)
server {
    listen 80;
    server_name nginx;

    location /media/ {
        alias /var/www/media/;
        access_log off;

        # Стори 41.5: TLS на этом vhost нет (listen 80 по Host: nginx),
        # поэтому набор без HSTS. До 41.5 этот vhost отдавал те же файлы
        # вообще без единого заголовка безопасности.
        include /etc/nginx/snippets/security-headers-no-hsts.conf;

        # Story 36.1: guard'ы обязаны стоять в КАЖДОМ vhost, который раздаёт
        # /var/www/media. Этот server слушает 80 по Host: nginx и без них
        # отдавал бы legacy-файлы обмена 1С в обход HTTPS-конфигурации.
        location /media/1c_temp/ {
            return 404;
        }

        location /media/1c_import/ {
            return 404;
        }
    }

    location /static/ {
        alias /var/www/static/;
        access_log off;

        # Стори 41.5: см. комментарий в /media/ выше.
        include /etc/nginx/snippets/security-headers-no-hsts.conf;
    }
}

# HTTPS Server - основная конфигурация
server {
    listen 443 ssl default_server;
    server_name 5.35.124.149 optisport.ru www.optisport.ru;

    # Blocklist: reject known attackers (see $blocked_ip geo in nginx.conf)
    if ($blocked_ip) {
        return 403;
    }

    # SSL сертификаты (LetsEncrypt)
    ssl_certificate /etc/letsencrypt/live/optisport.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/optisport.ru/privkey.pem;
    
    # SSL настройки безопасности
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Tuning for 1C Exchange (large files, long timeouts)
    client_max_body_size 500M;
    client_body_timeout 300s;
    client_header_timeout 300s;
    keepalive_timeout 300s;
    
    # Базовые заголовки безопасности (стори 41.5 — единый источник).
    #
    # ВНИМАНИЕ, главный механизм: `add_header` НЕ дополняет унаследованный набор,
    # а заменяет его. Как только в `location` появляется хоть одна собственная
    # директива `add_header` (например `Cache-Control`), весь набор с этого уровня
    # пропадает целиком. Именно так /static/, /media/, картинки товаров и /health
    # оставались без `X-Content-Type-Options: nosniff` (дефект FR-41-22).
    # Поэтому каждая такая локация ниже переобъявляет набор через include.
    # Не «упрощай» это, убрав include из локаций — заголовки исчезнут молча.
    include /etc/nginx/snippets/security-headers.conf;

    # Django Static и Media файлы
    location /static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Свой add_header выше вытеснил серверный набор — переобъявляем целиком
        include /etc/nginx/snippets/security-headers.conf;
        
        # Оптимизация для статических файлов
        location ~* \.(css|js)$ {
            gzip_static on;
            expires 1y;
        }
        
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            expires 1y;
        }
    }
    
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;

        # Свой add_header выше вытеснил серверный набор — переобъявляем целиком.
        # Вложенные локации (1c_temp, 1c_import, php|py|pl|sh) собственных
        # add_header не имеют и наследуют набор отсюда; `always` в сниппете
        # доставляет его и на их 404/403.
        include /etc/nginx/snippets/security-headers.conf;

        # Story 36.1: 1C temp/import directories moved outside MEDIA_ROOT.
        # Guards are defense-in-depth: media volume survives deploys, so payloads
        # written before the move (unfinished exchanges) physically remain here.
        # Files themselves are removed by `manage.py purge_legacy_1c_media`.
        location /media/1c_temp/ {
            return 404;
        }

        location /media/1c_import/ {
            return 404;
        }

        # Защита от исполнения скриптов в media
        location ~* \.(php|py|pl|sh)$ {
            deny all;
        }
    }

    # Product images (base_images хранятся без /media/ префикса)
    # Product images (base_images хранятся без /media/ префикса)
    # Используем regex, чтобы не перехватывать маршруты страниц товаров (например, /products/slug)
    location ~* ^/products/.*\.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        root /var/www/media;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;

        # Свой add_header выше вытеснил серверный набор — переобъявляем целиком
        include /etc/nginx/snippets/security-headers.conf;
    }

    # API маршруты - проксируем на Django backend
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Optimization for streaming uploads (1C)
        proxy_buffering off;
        proxy_request_buffering off;

        # Таймауты для API
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Стори 41.5: Django ставит X-Frame-Options (DENY), nosniff и
        # Referrer-Policy сам; CSP, Permissions-Policy и X-XSS-Protection
        # он выставить настройками не умеет — их даёт этот сниппет.
        # Собственный add_header внутри include вытесняет серверный набор,
        # поэтому X-XSS-Protection обязан быть в самом сниппете.
        include /etc/nginx/snippets/app-headers.conf;
    }

    # Django admin - проксируем на Django backend  
    location /admin/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Увеличенные таймауты для admin интерфейса
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Стори 41.5: Django ставит X-Frame-Options (DENY), nosniff и
        # Referrer-Policy сам; CSP, Permissions-Policy и X-XSS-Protection
        # он выставить настройками не умеет — их даёт этот сниппет.
        # Собственный add_header внутри include вытесняет серверный набор,
        # поэтому X-XSS-Protection обязан быть в самом сниппете.
        include /etc/nginx/snippets/app-headers.conf;
    }

    # Swagger/OpenAPI документация
    location /swagger/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Стори 41.5: Django ставит X-Frame-Options (DENY), nosniff и
        # Referrer-Policy сам; CSP, Permissions-Policy и X-XSS-Protection
        # он выставить настройками не умеет — их даёт этот сниппет.
        # Собственный add_header внутри include вытесняет серверный набор,
        # поэтому X-XSS-Protection обязан быть в самом сниппете.
        include /etc/nginx/snippets/app-headers.conf;
    }

    location /redoc/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Стори 41.5: Django ставит X-Frame-Options (DENY), nosniff и
        # Referrer-Policy сам; CSP, Permissions-Policy и X-XSS-Protection
        # он выставить настройками не умеет — их даёт этот сниппет.
        # Собственный add_header внутри include вытесняет серверный набор,
        # поэтому X-XSS-Protection обязан быть в самом сниппете.
        include /etc/nginx/snippets/app-headers.conf;
    }

    # Health check для мониторинга
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;

        # Свой add_header выше вытеснил серверный набор — переобъявляем целиком
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Статическая страница "Скоро открытие" — отдаётся при недоступности фронтенда.
    # Стори 41.5: собственных add_header здесь нет, значит серверный набор
    # наследуется целиком — include не нужен и добавлять его не надо.
    location /coming-soon/ {
        alias /var/www/coming-soon/;
        index index.html;
    }

    # Frontend Next.js приложение - все остальные маршруты
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Next.js специфичные настройки
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;

        # Стори 41.5: HTML фронтенда владеет своими заголовками —
        # X-Frame-Options, nosniff, Referrer-Policy, CSP, Permissions-Policy
        # и X-XSS-Protection выставляет frontend/next.config.ts. Здесь остаётся
        # только HSTS: его Next не выставляет, а TLS терминируется на nginx.
        # Этот одиночный add_header НАМЕРЕННО вытесняет серверный набор — иначе
        # каждый заголовок пришёл бы в двух экземплярах (от nginx и от Next).
        # proxy_hide_header здесь не нужен и не должен появляться: заголовки
        # апстрима через add_header не подавляются, они и есть источник набора.
        add_header Strict-Transport-Security "max-age=31536000" always;

        # При недоступности фронтенда (502/503/504) — отдаём страницу Coming-Soon
        proxy_intercept_errors on;
        error_page 502 503 504 =200 /coming-soon/index.html;
    }

    # Hot reload для разработки (Next.js)
    location /_next/webpack-hmr {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Стори 41.5: локация уходит в тот же апстрим, что и `location /`,
        # и обязана следовать тому же правилу. Своих add_header у неё не было,
        # поэтому она наследовала серверный набор — а Next на этом же ответе
        # ставит свой, и каждый заголовок приходил в двух экземплярах.
        # Одиночный HSTS вытесняет унаследованный набор и оставляет Next
        # единственным источником, как на `location /`.
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Блокировка доступа к служебным файлам.
    # Стори 41.5: собственных add_header здесь нет — серверный набор
    # наследуется (с `always` он доходит и на 403), include не требуется.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
