# То же, что security-headers.conf, но БЕЗ Strict-Transport-Security.
#
# Стори 41.5. Для окружений без TLS: внутренний vhost `server_name nginx`
# (обслуживает межконтейнерные запросы по HTTP) и локальный `local.conf`.
# HSTS по HTTP браузером игнорируется, но объявлять его там, где TLS нет,
# — вводить в заблуждение читателя конфига.
#
# Всё остальное — как в security-headers.conf, включая обязательный `always`
# и требование посимвольного совпадения CSP/Permissions-Policy с прочими
# источниками (два других сниппета и frontend/next.config.ts).

add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "1; mode=block" always;
