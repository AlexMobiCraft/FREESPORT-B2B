# Заголовки безопасности для локаций, проксируемых в Django
# (/api/, /admin/, /swagger/, /redoc/).
#
# Стори 41.5. Здесь ТОЛЬКО то, чего Django не умеет выставить настройками:
#   - Content-Security-Policy и Permissions-Policy — соответствующих settings нет;
#   - X-XSS-Protection — Django перестал его отдавать в 4.0 (в проекте 5.2),
#     `SECURE_BROWSER_XSS_FILTER` в settings мёртв и ничего не шлёт.
# X-Frame-Options (DENY), X-Content-Type-Options и Referrer-Policy Django ставит
# сам через SecurityMiddleware/XFrameOptionsMiddleware — дублировать их здесь
# нельзя, иначе на ответе окажется по два экземпляра каждого.
#
# frame-ancestors здесь 'none' (а не 'self', как на остальных поверхностях)
# и обязан оставаться согласованным с `X_FRAME_OPTIONS = "DENY"` в Django:
# в поддерживающих браузерах frame-ancestors перекрывает X-Frame-Options,
# и рассогласование молча меняет фактическую политику встраивания.
#
# `always` обязателен: без него заголовки теряются на 401/403/404/5xx от Django.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; frame-ancestors 'none'" always;
add_header X-XSS-Protection "1; mode=block" always;
