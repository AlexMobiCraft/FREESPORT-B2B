# Заголовки безопасности для ресурсов, которые nginx отдаёт САМ
# (/static/, /media/, картинки товаров, /health, серверный дефолт HTTPS-vhost).
#
# Стори 41.5. Подключать через `include /etc/nginx/snippets/security-headers.conf;`
# в КАЖДОЙ локации, где объявлен собственный `add_header`: nginx наследует набор
# `add_header` с верхнего уровня только до тех пор, пока на текущем уровне нет ни
# одной собственной директивы. Первый же свой `add_header` (например,
# `Cache-Control`) стирает весь унаследованный набор целиком.
#
# Флаг `always` обязателен: без него заголовки не попадают на ответы вне списка
# 200/204/301/302/304, а под /media/ живут `return 404` (1c_temp, 1c_import) и
# `deny all` (php/py/pl/sh).
#
# Парная версия без HSTS — security-headers-no-hsts.conf (окружения без TLS).
# CSP и Permissions-Policy обязаны совпадать со всеми остальными сниппетами
# и с frontend/next.config.ts; расхождение ловит backend/tests/unit/test_nginx_security_headers.py.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "1; mode=block" always;
